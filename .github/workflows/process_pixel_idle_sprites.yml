name: Process pixel idle sprites

on:
  push:
    paths:
      - "pixel_idle_animation/input/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r pixel_idle_animation/script/requirements.txt

      - name: Process input images
        run: python pixel_idle_animation/script/process_sprites.py

      - name: Commit generated files and archived inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixel_idle_animation/input pixel_idle_animation/output pixel_idle_animation/old
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: process pixel idle sprite input"
            git push
          fi
