name: Validate Issue Structure

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write

concurrency:
  group: validate-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check issue structure against schema
        id: check
        run: python workflow/script/issues.py check-issue
        continue-on-error: true

      - name: Commit updated issues.log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workflow/data/issues.log
          if git diff --cached --quiet; then
            echo "No changes to workflow/data/issues.log"
          else
            git commit -m "chore: update issues.log for #${{ github.event.issue.number }}"
            git push
          fi

      - name: Fail the check if the Issue is invalid
        if: steps.check.outcome == 'failure'
        run: |
          echo "Issue #${{ github.event.issue.number }} failed schema validation. See workflow/data/issues.log for details."
          exit 1
